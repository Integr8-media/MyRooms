name: Windows desktop build

# Slow (Rust compile), so it runs on the main branches and on demand, not on every PR.
on:
  workflow_dispatch:
  push:
    branches: [main, dev]

jobs:
  tauri-windows:
    runs-on: windows-latest
    # Backend URLs are baked into the app at build time.
    # Set them under GitHub → Settings → Secrets and variables → Actions → Variables.
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_POWERSYNC_URL: ${{ vars.EXPO_PUBLIC_POWERSYNC_URL }}
      EXPO_PUBLIC_APP_URL: ${{ vars.EXPO_PUBLIC_APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: myrooms-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
