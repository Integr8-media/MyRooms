name: Windows desktop build

# Slow (Rust compile), so it runs on the main branches, on release tags and on demand, not on
# every PR.
#
# - Pushes to dev/main: an unsigned test installer (artifact), as before.
# - Tags `v*` (e.g. v1.0.1) or a manual run with "release" ticked: the release installer, signed
#   for auto-update (and code-signed if configured), plus latest.json, as an artifact; uploaded
#   to the VPS when the SSH secrets exist. See deploy/README.md, step 9.
on:
  workflow_dispatch:
    inputs:
      release:
        description: Build a release (update files + latest.json)
        type: boolean
        default: false
  push:
    branches: [main, dev]
    tags: ['v*']

jobs:
  tauri-windows:
    runs-on: windows-latest
    # Backend URLs are baked into the app at build time.
    # Set them under GitHub → Settings → Secrets and variables → Actions → Variables.
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_POWERSYNC_URL: ${{ vars.EXPO_PUBLIC_POWERSYNC_URL }}
      EXPO_PUBLIC_APP_URL: ${{ vars.EXPO_PUBLIC_APP_URL }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
      EXPO_PUBLIC_APP_ENV: ${{ vars.EXPO_PUBLIC_APP_ENV }}
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release == true }}
      # Secrets can't be read in `if:`; these say whether the optional ones are set.
      HAS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
      HAS_VPS: ${{ secrets.VPS_SSH_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      - name: Test build (unsigned)
        if: env.RELEASE != 'true'
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        if: env.RELEASE != 'true'
        with:
          name: myrooms-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

      # Release. Variables: MYROOMS_UPDATE_URL (https://app.example.com/desktop),
      # TAURI_UPDATER_PUBKEY. Secrets: TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD).
      # Optional code signing: secret WINDOWS_CERTIFICATE (base64 .pfx) + WINDOWS_CERTIFICATE_PASSWORD,
      # or variable WINDOWS_SIGN_COMMAND (e.g. Azure Artifact Signing).
      - name: Import code-signing certificate
        id: cert
        if: env.RELEASE == 'true' && env.HAS_CERT == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT
      - name: Release build (signed updates)
        if: env.RELEASE == 'true'
        env:
          MYROOMS_UPDATE_URL: ${{ vars.MYROOMS_UPDATE_URL }}
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_SIGN_COMMAND: ${{ vars.WINDOWS_SIGN_COMMAND }}
          WINDOWS_CERT_THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
        run: |
          node scripts/desktop-release-config.mjs
          npx tauri build --bundles nsis --config src-tauri/tauri.release.conf.json
          node scripts/desktop-latest-json.mjs "MyRooms ${{ github.ref_name }}"
      - uses: actions/upload-artifact@v4
        if: env.RELEASE == 'true'
        with:
          name: myrooms-windows-release
          path: dist-desktop/

      # Optional: publish to the VPS (secrets VPS_SSH_KEY, VPS_HOST, VPS_USER).
      # The installer goes up first, latest.json last, so apps never see a missing file.
      - name: Upload to the VPS
        if: env.RELEASE == 'true' && env.HAS_VPS == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        shell: bash
        run: |
          install -m 600 /dev/null ~/vps_key && printf '%s\n' "$VPS_SSH_KEY" > ~/vps_key
          ssh_opts="-i $HOME/vps_key -o StrictHostKeyChecking=accept-new"
          ssh $ssh_opts "$VPS_USER@$VPS_HOST" 'mkdir -p /var/www/myrooms-desktop'
          scp $ssh_opts dist-desktop/*.exe dist-desktop/*.sig "$VPS_USER@$VPS_HOST:/var/www/myrooms-desktop/"
          scp $ssh_opts dist-desktop/latest.json "$VPS_USER@$VPS_HOST:/var/www/myrooms-desktop/"
          rm ~/vps_key
