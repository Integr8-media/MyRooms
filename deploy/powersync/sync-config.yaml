# PowerSync Sync Streams: which rows each signed-in user downloads to their device.
# These mirror the RLS policies in supabase/migrations (RLS is still what protects writes).
#   owner    everything in their organizations
#   manager  their branches, the staff of those branches, invitations they sent
#   cashier  their branches and their own membership
#   everyone station types, rate rules and packages of their organizations (to price sessions),
#            and the stations, sessions (with segments), bills and payments of the branches
#            they work in
config:
  edition: 3

streams:
  # The signed-in user's own memberships and branch assignments.
  my_account:
    auto_subscribe: true
    queries:
      - SELECT * FROM memberships WHERE user_id = auth.user_id()
      - SELECT * FROM member_branches WHERE user_id = auth.user_id()

  my_organizations:
    auto_subscribe: true
    query: SELECT * FROM organizations WHERE id IN (SELECT org_id FROM memberships WHERE user_id = auth.user_id())

  # Prices and station types: every member needs them for live estimates.
  org_pricing:
    auto_subscribe: true
    with:
      my_orgs: SELECT org_id FROM memberships WHERE user_id = auth.user_id()
    queries:
      - SELECT * FROM station_types WHERE org_id IN my_orgs
      - SELECT * FROM rate_rules WHERE org_id IN my_orgs
      - SELECT * FROM packages WHERE org_id IN my_orgs

  # Branches the user is assigned to (managers and cashiers), and their stations.
  assigned_branches:
    auto_subscribe: true
    with:
      my_branches: SELECT branch_id FROM member_branches WHERE user_id = auth.user_id()
    queries:
      - SELECT * FROM branches WHERE id IN my_branches
      - SELECT * FROM stations WHERE branch_id IN my_branches
      - SELECT * FROM sessions WHERE branch_id IN my_branches
      - SELECT * FROM session_segments WHERE branch_id IN my_branches
      - SELECT * FROM bills WHERE branch_id IN my_branches
      - SELECT * FROM payments WHERE branch_id IN my_branches

  # Owners: every branch, member and invitation of their organizations.
  owner_data:
    auto_subscribe: true
    with:
      owned_orgs: SELECT org_id FROM memberships WHERE user_id = auth.user_id() AND role = 'owner'
    queries:
      - SELECT * FROM branches WHERE org_id IN owned_orgs
      - SELECT * FROM stations WHERE org_id IN owned_orgs
      - SELECT * FROM sessions WHERE org_id IN owned_orgs
      - SELECT * FROM session_segments WHERE org_id IN owned_orgs
      - SELECT * FROM bills WHERE org_id IN owned_orgs
      - SELECT * FROM payments WHERE org_id IN owned_orgs
      - SELECT * FROM memberships WHERE org_id IN owned_orgs
      - SELECT * FROM member_branches WHERE org_id IN owned_orgs
      - SELECT * FROM invitations WHERE org_id IN owned_orgs

  # Managers: branch assignments in the branches they manage...
  manager_branch_staff:
    auto_subscribe: true
    with:
      managed_branches: SELECT branch_id FROM member_branches WHERE membership_id IN (SELECT id FROM memberships WHERE user_id = auth.user_id() AND role = 'manager')
    queries:
      - SELECT * FROM member_branches WHERE branch_id IN managed_branches

  # ...and the memberships (name, email, role) of the people working there.
  manager_members:
    auto_subscribe: true
    query: SELECT * FROM memberships WHERE id IN (SELECT membership_id FROM member_branches WHERE branch_id IN (SELECT branch_id FROM member_branches WHERE membership_id IN (SELECT id FROM memberships WHERE user_id = auth.user_id() AND role = 'manager')))

  # Invitations the user sent (managers inviting cashiers).
  sent_invitations:
    auto_subscribe: true
    query: SELECT * FROM invitations WHERE invited_by = auth.user_id()
